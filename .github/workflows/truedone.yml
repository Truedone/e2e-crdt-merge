# The project's own install and test, then the truedone gate pinned at
# Truedone/truedone main (E2E-01): the gate runs the project's tests on the
# pull request's base and head and labels the verdict.
name: truedone
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest
      - uses: Truedone/truedone/packages/action@54f15b0bc2a90c05af0aa4a2aedfcb7b2b0703ee
